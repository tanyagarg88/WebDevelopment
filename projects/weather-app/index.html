<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Weather Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #e0f2fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .weather-card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    .temp { font-size: 3rem; font-weight: bold; color: #0284c7; margin: 1rem 0; }
    .location { font-size: 1.25rem; color: #334155; }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="location" id="city-name">New Delhi, IN</div>
    <div class="temp" id="temp-val">29°C</div>
    <p id="condition-desc">Partly Cloudy</p>
  </div>
</body>
</html>
