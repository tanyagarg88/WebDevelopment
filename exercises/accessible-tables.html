<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Data Table</title>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 12px; border: 1px solid #cbd5e1; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <table>
    <caption>Weekly Study Timetable</caption>
    <thead><tr><th>Day</th><th>Module</th><th>Duration</th></tr></thead>
    <tbody><tr><td>Monday</td><td>HTML Forms</td><td>2 Hours</td></tr></tbody>
  </table>
</body>
</html>
