<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    .form-container { max-width: 480px; margin: 2rem auto; padding: 2rem; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .input-field { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Get in Touch</h2>
    <form>
      <label for="name">Full Name</label>
      <input id="name" type="text" class="input-field" required>
      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
