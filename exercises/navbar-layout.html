<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Flexbox Navbar</title>
  <style>
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; color: white; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: #cbd5e1; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: #38bdf8; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">WebDev</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
