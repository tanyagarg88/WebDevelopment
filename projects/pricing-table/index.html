<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Pricing Plans</title>
  <style>
    .pricing-grid { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; padding: 2rem; }
    .price-card { background: white; border: 2px solid #e2e8f0; border-radius: 16px; padding: 2rem; width: 280px; text-align: center; }
    .price-card.featured { border-color: #3b82f6; transform: scale(1.05); }
    .price { font-size: 2.5rem; font-weight: bold; color: #1e293b; }
  </style>
</head>
<body>
  <div class="pricing-grid">
    <div class="price-card"><h3>Starter</h3><div class="price">$9</div></div>
    <div class="price-card featured"><h3>Pro</h3><div class="price">$29</div></div>
  </div>
</body>
</html>
