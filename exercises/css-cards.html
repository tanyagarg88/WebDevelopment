<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Card UI</title>
  <style>
    .card { background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .card-title { font-size: 1.25rem; font-weight: 600; color: #1e293b; }
    .card-body { color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Card Component</h2>
    <p class="card-body">Modular card layout built with clean CSS.</p>
  </div>
</body>
</html>
